{% extends "base.html" %}
{% block body %}
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label for="language">Language</label>
  <select id="language" name="language"><option value="bn" {% if s.language=='bn' %}selected{% endif %}>Bangla</option><option value="en" {% if s.language=='en' %}selected{% endif %}>English</option></select>
  <label for="level">Learner level</label><input id="level" name="level" value="{{ s.level }}">
  <label for="current_book">Current book name</label><input id="current_book" name="current_book" value="{{ s.current_book }}">
  <label for="voice_speed">Voice speed (0.7 slow to 1.4 fast)</label><input id="voice_speed" name="voice_speed" type="number" step="0.1" min="0.7" max="1.4" value="{{ s.voice_speed }}">
  <label for="hp">Audio output</label>
  <select id="hp" name="headphone_pref">{% for o,l in [('speaker','Speaker'),('headphones','Headphone jack (private)'),('bluetooth','Bluetooth earbuds (private)')] %}<option value="{{ o }}" {% if s.headphone_pref==o %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
  <label for="light">Reading light (0 off to 1 full)</label><input id="light" name="light_level" type="number" step="0.1" min="0" max="1" value="{{ s.light_level }}">
  <fieldset><legend>Reading</legend>
    <label><input type="checkbox" name="accessibility_mode" {% if s.accessibility_mode %}checked{% endif %}> Accessibility mode: say "turn the page" at the end of each spread</label>
  </fieldset>
  <fieldset><legend>Memory</legend>
    <label><input type="checkbox" name="memory_enabled" {% if s.memory_enabled %}checked{% endif %}> Remember notes, study history and quiz results on this device</label>
  </fieldset>
  <p><button type="submit">Save settings</button></p>
</form>
<h2>Change PIN</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><input type="hidden" name="action" value="pin">
  <label for="op">Current PIN</label><input id="op" name="old_pin" type="password" inputmode="numeric" required>
  <label for="np">New PIN (4 to 8 digits)</label><input id="np" name="new_pin" type="password" inputmode="numeric" required>
  <p><button type="submit">Change PIN</button></p></form>
{% endblock %}
